name: Frontend CI/CD

# Pull requests: lint + test + build only.
# Push to main (or "Run workflow" by hand): the same checks, then deploy to the VPS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      # --retry: a QR reload test is timing-sensitive on busy runners.
      - run: npm test -- --retry=2
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_ENABLE_QR_API: "true"
          VITE_REALTIME_ENABLED: "true"

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "::error::Missing secrets VPS_SSH_KEY / VPS_HOST (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # deploy.sh lives in the backend repo, so refresh that checkout first, then rebuild only "web".
      - name: Pull and restart frontend on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.APP_DIR || '~/pos-saas' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" -o ServerAliveInterval=30 \
            "${VPS_USER:-root}@$VPS_HOST" \
            "set -e; cd $APP_DIR/pos-saas-be && git fetch --quiet origin main && git reset --quiet --hard origin/main && bash deploy/deploy.sh web main"
